<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { renderTemplate } from '/app/social/renderer.js';
import { loadFonts } from '/app/social/design-tokens.js';

function bld(w, h) { // stand-in commercial building photo
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#9fb6c4'); sky.addColorStop(1, '#dfe7ec');
  x.fillStyle = sky; x.fillRect(0, 0, w, h);
  const towers = [[0.10, 0.42, 0.20], [0.34, 0.30, 0.22], [0.60, 0.20, 0.26]];
  towers.forEach(([bx, top, bw], i) => {
    x.fillStyle = ['#26323d', '#2f3e4a', '#1d2832'][i];
    x.fillRect(w * bx, h * top, w * bw, h);
    x.fillStyle = 'rgba(200,220,235,0.18)';
    for (let r = h * top + 20; r < h - 20; r += 34) for (let cc = w * bx + 14; cc < w * (bx + bw) - 14; cc += 26) x.fillRect(cc, r, 14, 20);
  });
  return createImageBitmap(c);
}
function head(w) {
  const c = document.createElement('canvas'); c.width = w; c.height = w; const x = c.getContext('2d');
  x.fillStyle = '#7d8a99'; x.fillRect(0, 0, w, w);
  x.fillStyle = '#e8c9a8'; x.beginPath(); x.arc(w / 2, w * 0.42, w * 0.2, 0, 7); x.fill();
  x.fillStyle = '#2b3038'; x.beginPath(); x.ellipse(w / 2, w * 0.96, w * 0.34, w * 0.32, 0, 0, 7); x.fill();
  return createImageBitmap(c);
}

const DATA = {
  'cre-just-listed': { kicker: 'For Sale', title: '2600 Dodge Street', subtitle: 'Class A Office · 48,000 SF · Downtown',
    stats: [{ value: '$6.2M', label: 'Price' }, { value: '48,000', label: 'SF' }, { value: '7.1%', label: 'Cap Rate' }],
    agent: 'Daniel Reardon', phone: '402.555.0142', brokerage: 'Gateway Real Estate Advisors' },
  'cre-just-closed': { kicker: 'Just Closed', title: '1180 Farnam Avenue', subtitle: 'Multi-Tenant Retail · 12,400 SF',
    stats: [{ value: '$3.4M', label: 'Sale Price' }, { value: '22', label: 'Days on Mkt' }, { value: '6.4%', label: 'Cap Rate' }],
    agent: 'Daniel Reardon', phone: '402.555.0142', brokerage: 'Gateway Real Estate Advisors' },
  'cre-stats': { kicker: 'By the Numbers', title: 'Omaha Multifamily · Q2 2026', subtitle: 'Metro investment snapshot',
    stats: [{ value: '5.8%', label: 'Avg Cap Rate' }, { value: '$142K', label: 'Price / Unit' }, { value: '94.2%', label: 'Occupancy' }, { value: '+3.1%', label: 'Rent Growth' }],
    agent: 'Daniel Reardon', phone: '402.555.0142', brokerage: 'Gateway Real Estate Advisors' },
};

(async () => {
  await loadFonts('/');
  const photo = await bld(1600, 1200), headshot = await head(500);
  const set = [
    ['cre-just-listed', 'luxe-dark'], ['cre-just-closed', 'luxe-dark'], ['cre-stats', 'luxe-dark'],
    ['cre-just-listed', 'ivory'], ['cre-just-listed', 'slate'],
  ];
  const out = [];
  for (const [templateId, theme] of set) {
    const canvas = document.createElement('canvas');
    renderTemplate(canvas, { templateId, sizeId: 'ig-portrait', theme, data: DATA[templateId], assets: { photo, headshot } });
    out.push({ key: templateId + '__' + theme, b64: canvas.toDataURL('image/png').split(',')[1] });
  }
  window.__PNGS = out;
})();
</script></body></html>
