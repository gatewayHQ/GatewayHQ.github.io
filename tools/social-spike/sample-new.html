<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { renderTemplate } from '/app/social/renderer.js';
import { loadFonts } from '/app/social/design-tokens.js';
function bld(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const s=x.createLinearGradient(0,0,0,h);s.addColorStop(0,'#9fb6c4');s.addColorStop(1,'#dfe7ec');x.fillStyle=s;x.fillRect(0,0,w,h);[[0.1,0.42,0.2],[0.34,0.3,0.22],[0.6,0.2,0.26]].forEach(([bx,t,bw],i)=>{x.fillStyle=['#26323d','#2f3e4a','#1d2832'][i];x.fillRect(w*bx,h*t,w*bw,h);});return createImageBitmap(c);}
function head(w){const c=document.createElement('canvas');c.width=w;c.height=w;const x=c.getContext('2d');x.fillStyle='#6b7a89';x.fillRect(0,0,w,w);x.fillStyle='#e8c9a8';x.beginPath();x.arc(w/2,w*0.42,w*0.2,0,7);x.fill();x.fillStyle='#2b3038';x.beginPath();x.ellipse(w/2,w*0.96,w*0.34,w*0.32,0,0,7);x.fill();return createImageBitmap(c);}
const agents=[{name:'Daniel Reardon',phone:'402.555.0142'}];
const SET={
 'cre-open-house':{kicker:'Open House',title:'2600 Dodge Street',subtitle:'This Saturday · Refreshments provided',stats:[{value:'Sat May 10',label:'Date'},{value:'1–3 PM',label:'Time'},{value:'$6.2M',label:'Price'}],agents,brokerage:'Gateway Real Estate Advisors'},
 'cre-testimonial':{kicker:'Client Review',title:'Daniel made our 1031 exchange completely painless and found us a better cap rate than we expected.',subtitle:'Sarah & Tom M., Investors',agents,brokerage:'Gateway Real Estate Advisors'},
 'cre-meet-agent':{kicker:'Meet Your Advisor',title:'Daniel Reardon',subtitle:'Commercial & Investment Advisor',stats:[{value:'12',label:'Years Exp.'},{value:'$240M',label:'Closed'},{value:'Multifamily',label:'Specialty'}],agents,brokerage:'Gateway Real Estate Advisors'},
};
(async()=>{await loadFonts('/');const photo=await bld(1600,1200),h1=await head(600);
 const out=[];
 for(const [id,assets] of [['cre-open-house',{photo,headshots:[h1]}],['cre-testimonial',{headshots:[h1]}],['cre-meet-agent',{headshots:[h1]}]]){
   const c=document.createElement('canvas');renderTemplate(c,{templateId:id,sizeId:'ig-portrait',theme:'luxe-dark',data:SET[id],assets});
   out.push({key:id,b64:c.toDataURL('image/png').split(',')[1]});}
 window.__PNGS=out;})();
</script></body></html>
