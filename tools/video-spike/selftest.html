<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Video engine self-test</title></head>
<body>
<p>Running client-side render self-test… see window.__RESULT</p>
<script type="module">
  import { buildModel } from '/app/video/scene-model.js';
  import { encode, detectSupport } from '/app/video/encoder.js';
  import { totalDuration, drawFrame } from '/app/video/renderer.js';

  // Generate stand-in listing photos with a canvas gradient (no network).
  function makeImg(w, h, c1, c2) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, c1); g.addColorStop(1, c2);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = 'rgba(255,255,255,0.12)'; x.fillRect(w * 0.1, h * 0.1, w * 0.8, h * 0.8);
    return createImageBitmap(c);
  }

  (async () => {
    try {
      const support = await detectSupport();
      const imgs = await Promise.all([
        makeImg(1600, 1200, '#2f6f4f', '#0d2a1a'),
        makeImg(1600, 1200, '#2f4f6f', '#0d1a2a'),
      ]);
      const data = {
        format: 'square', eyebrow: 'Just Listed', address: '123 Test St, Lincoln NE',
        price: '$450,000', beds: '4', baths: '3', sqft: '2,400', agent: 'Jane Agent',
        brokerage: 'Gateway Real Estate Advisors', cta: 'Schedule a Showing',
        features: ['Renovated Kitchen — quartz'],
      };
      const model = buildModel(data, imgs, { logo: null }, 'kenburns');

      // sanity: make sure a mid frame draws without throwing
      const probe = document.createElement('canvas'); probe.width = model.width; probe.height = model.height;
      drawFrame(model, totalDuration(model) / 2, probe.getContext('2d'), model.width, model.height);

      const res = await encode(model, { quality: 'draft', onProgress: () => {} });
      const buf = await res.blob.arrayBuffer();
      const bytes = new Uint8Array(buf); let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      window.__RESULT = {
        ok: true, support, ext: res.ext, mime: res.mime, path: res.path,
        size: buf.byteLength, durationSec: totalDuration(model),
        frames: Math.round(totalDuration(model) * model.fps), b64: btoa(bin),
      };
    } catch (e) {
      window.__RESULT = { ok: false, error: String((e && e.stack) || e) };
    }
  })();
</script>
</body>
</html>
