name: Render Listing Video

# ================================================================
# Triggered by the Supabase Edge Function (gateway-api /api/video-render)
# or manually from the Actions tab.
#
# Edge Function flow (preferred):
#   job_id, output_slug, composition_path, music_path, quality
#   The Edge Function uploads the composition to compositions/pending/
#   then dispatches this workflow with job_id set.
#
# Legacy browser flow (GH PAT in browser):
#   output_slug, composition_path, music_path
#   (job_id is empty — no Supabase status callbacks)
#
# Required repository secrets for status callbacks:
#   SUPABASE_URL              = https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY = <service role key>
#
# Speed notes:
#   Cold run (no cache): ~5-8 min setup + render
#   Warm run (cache hit): ~10-15s setup + render  ← target 3-5 min total
#   Cache is keyed by OS + v-number; bump HF_TOOLS_CACHE_KEY to force refresh
# ================================================================

on:
  workflow_dispatch:
    inputs:
      output_slug:
        description: 'Output filename (no .mp4)'
        required: true
        type: string

      # ── Vercel flow: pass signed URLs ─────────────────────────────
      job_id:
        description: 'video_jobs UUID (enables status callbacks)'
        required: false
        default: ''
        type: string
      composition_url:
        description: 'Signed URL to download composition HTML'
        required: false
        default: ''
        type: string
      music_url:
        description: 'Signed URL to download music file (optional)'
        required: false
        default: ''
        type: string

      # ── Legacy flow: repo-relative file paths ─────────────────────
      composition_path:
        description: 'Repo-relative path to composition HTML (legacy)'
        required: false
        default: ''
        type: string
      music_path:
        description: 'Repo-relative path to music file (legacy, optional)'
        required: false
        default: ''
        type: string

      # ── Render quality ────────────────────────────────────────────
      # Must match HyperFrames CLI values exactly: draft | standard | high.
      quality:
        description: 'Render quality (draft=fast iteration, standard=social, high=final delivery)'
        required: false
        default: 'standard'
        type: choice
        options:
          - draft
          - standard
          - high

permissions:
  contents: write

# Prevent duplicate renders of the same slug running simultaneously.
# If a second dispatch arrives while a render is in-flight, cancel the older one.
concurrency:
  group: render-${{ inputs.output_slug || github.run_id }}
  cancel-in-progress: false

env:
  # Bump this string to force a full cache refresh (e.g. after a HyperFrames update)
  HF_TOOLS_CACHE_KEY: hf-tools-v3

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record start time
        id: timer
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ── Notify Supabase: render has started ──────────────────────
      # Writes directly to Supabase REST API — no proxy needed.
      # Requires repo secrets: SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY
      - name: Notify rendering started
        if: inputs.job_id != ''
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          [ -z "$SB_URL" ] && echo "::warning::SUPABASE_URL not set — skipping callback" && exit 0
          curl -sf -X PATCH "${SB_URL}/rest/v1/video_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"rendering\",\"run_id\":\"${{ github.run_id }}\"}" \
          || echo "::warning::Supabase status update failed (non-fatal)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Cache HyperFrames node_modules ────────────────────────────
      # Skips ~90s npm install on warm runs. Bust by changing HF_TOOLS_CACHE_KEY.
      - name: Restore HyperFrames cache
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: /tmp/hf-tools/node_modules
          key: ${{ env.HF_TOOLS_CACHE_KEY }}-${{ runner.os }}

      - name: Install HyperFrames
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/hf-tools
          cd /tmp/hf-tools
          echo '{"private":true}' > package.json
          npm install hyperframes

      # ── Cache Puppeteer Chrome binary ─────────────────────────────
      # Skips ~90s Chrome download (~300 MB) on warm runs.
      - name: Restore Chrome cache
        id: chrome-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-v1

      - name: Install Chrome for Puppeteer
        if: steps.chrome-cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp/hf-tools
          node_modules/.bin/puppeteer browsers install chrome

      # ── FFmpeg is pre-installed on ubuntu-latest — no install needed ──

      # ── Fetch composition ─────────────────────────────────────────
      - name: Prepare composition
        run: |
          mkdir -p /tmp/hf-render
          COMP_URL="${{ inputs.composition_url }}"
          COMP_PATH="${{ inputs.composition_path }}"
          if [ -n "$COMP_URL" ]; then
            curl -fsSL "$COMP_URL" -o /tmp/hf-render/index.html
          elif [ -n "$COMP_PATH" ]; then
            cp "${{ github.workspace }}/$COMP_PATH" /tmp/hf-render/index.html
          else
            echo "::error::No composition source (composition_url or composition_path required)"
            exit 1
          fi

      # ── Fetch music ───────────────────────────────────────────────
      - name: Prepare music
        id: music
        run: |
          MUSIC_URL="${{ inputs.music_url }}"
          MUSIC_PATH="${{ inputs.music_path }}"
          if [ -n "$MUSIC_URL" ]; then
            EXT="${MUSIC_URL##*.}"; EXT="${EXT%%\?*}"
            curl -fsSL "$MUSIC_URL" -o "/tmp/music.${EXT:-mp3}"
            echo "path=/tmp/music.${EXT:-mp3}" >> "$GITHUB_OUTPUT"
          elif [ -n "$MUSIC_PATH" ] && [ -f "${{ github.workspace }}/$MUSIC_PATH" ]; then
            echo "path=${{ github.workspace }}/$MUSIC_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # ── Render to MP4 (with auto-retry on transient failure) ─────────
      - name: Render to MP4
        run: |
          mkdir -p "${{ github.workspace }}/renders"
          OUTPUT="${{ github.workspace }}/renders/${{ inputs.output_slug }}_silent.mp4"
          cd /tmp/hf-render

          # Normalize quality — HyperFrames accepts only draft|standard|high.
          # Any other value (legacy "balanced"/"fast") falls back to standard.
          QUALITY="${{ inputs.quality }}"
          case "$QUALITY" in
            draft|standard|high) ;;
            *) echo "::warning::Unknown quality '$QUALITY' — using 'standard'"; QUALITY="standard" ;;
          esac
          echo "Rendering at quality=$QUALITY"

          render_attempt() {
            /tmp/hf-tools/node_modules/.bin/hyperframes render \
              --quality "$QUALITY" \
              --fps 30 \
              --output "$OUTPUT"
          }

          # Attempt 1
          render_attempt || {
            echo "::warning::Render attempt 1 failed — retrying in 10s..."
            sleep 10
            render_attempt || {
              echo "::error::Render failed after 2 attempts. Check HyperFrames logs above."
              exit 1
            }
          }

          # Verify the output actually exists and is a real video (>100 KB).
          # A zero-byte or tiny file means the render silently produced nothing.
          if [ ! -f "$OUTPUT" ]; then
            echo "::error::Render reported success but $OUTPUT does not exist."
            exit 1
          fi
          SIZE=$(stat -c%s "$OUTPUT")
          echo "Rendered file size: $SIZE bytes"
          if [ "$SIZE" -lt 102400 ]; then
            echo "::error::Rendered file is only $SIZE bytes — render produced an empty/broken video."
            exit 1
          fi
          echo "✅ Render succeeded — $OUTPUT ($SIZE bytes)"

      # ── Mix background music ──────────────────────────────────────
      - name: Mix in background music
        run: |
          SILENT="${{ github.workspace }}/renders/${{ inputs.output_slug }}_silent.mp4"
          FINAL="${{ github.workspace }}/renders/${{ inputs.output_slug }}.mp4"
          MUSIC="${{ steps.music.outputs.path }}"
          if [ -n "$MUSIC" ] && [ -f "$MUSIC" ]; then
            DURATION=$(ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$SILENT" | awk '{print int($1)-2}')
            ffmpeg -i "$SILENT" -i "$MUSIC" \
              -c:v copy -c:a aac -b:a 192k \
              -map 0:v:0 -map 1:a:0 \
              -af "afade=t=out:st=${DURATION}:d=2,volume=0.75" \
              -shortest -y "$FINAL"
            rm "$SILENT"
          else
            mv "$SILENT" "$FINAL"
          fi

      # ── Commit render + clean up ──────────────────────────────────
      - name: Commit render and clean up
        run: |
          cd "${{ github.workspace }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add "renders/${{ inputs.output_slug }}.mp4"
          if [ -n "${{ inputs.composition_path }}" ]; then
            git rm --ignore-unmatch "${{ inputs.composition_path }}"
          fi
          if [ -n "${{ inputs.music_path }}" ]; then
            git rm --ignore-unmatch "${{ inputs.music_path }}"
          fi
          git commit -m "Rendered video: ${{ inputs.output_slug }}" || echo "Nothing to commit"
          git push

      # ── Clean up pending files on failure ────────────────────────
      # If the render fails, we still want to remove the uploaded composition
      # so the repo doesn't accumulate orphaned files from failed renders.
      - name: Clean up pending files on failure
        if: failure()
        run: |
          cd "${{ github.workspace }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          CHANGED=0
          if [ -n "${{ inputs.composition_path }}" ] && [ -f "${{ inputs.composition_path }}" ]; then
            git rm --ignore-unmatch "${{ inputs.composition_path }}"
            CHANGED=1
          fi
          if [ -n "${{ inputs.music_path }}" ] && [ -f "${{ inputs.music_path }}" ]; then
            git rm --ignore-unmatch "${{ inputs.music_path }}"
            CHANGED=1
          fi
          if [ "$CHANGED" = "1" ]; then
            git commit -m "chore: clean up pending files for failed render ${{ inputs.output_slug }}" && git push \
            || echo "::warning::Cleanup commit failed — pending files may remain in compositions/pending/"
          fi

      # ── Report final status to Supabase ──────────────────────────
      - name: Report final status
        if: always() && inputs.job_id != ''
        env:
          SB_URL:      ${{ secrets.SUPABASE_URL }}
          SB_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_STATUS:  ${{ job.status }}
          START_EPOCH: ${{ steps.timer.outputs.epoch }}
        run: |
          [ -z "$SB_URL" ] && echo "::warning::SUPABASE_URL not set — skipping final callback" && exit 0
          ELAPSED=$(( $(date +%s) - START_EPOCH ))
          if [ "$JOB_STATUS" = "success" ]; then
            RENDER_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/renders/${{ inputs.output_slug }}.mp4"
            PAYLOAD=$(printf '{"status":"completed","render_url":"%s","elapsed_sec":%d,"run_id":"%s"}' \
              "$RENDER_URL" "$ELAPSED" "${{ github.run_id }}")
          else
            PAYLOAD=$(printf '{"status":"failed","error_msg":"Render workflow %s — check the Actions log for details.","elapsed_sec":%d,"run_id":"%s"}' \
              "$JOB_STATUS" "$ELAPSED" "${{ github.run_id }}")
          fi
          curl -sf -X PATCH "${SB_URL}/rest/v1/video_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
          || echo "::warning::Final Supabase update failed (video may still be accessible in renders/)"
