name: Health Monitor

# Runs every 6 hours + on-demand.
# Checks the Supabase Edge Function, Supabase REST API, and GitHub Pages.
# Creates a GitHub issue if any service is degraded.
# Writes results to Supabase system_health table if credentials are available.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger from Actions tab

jobs:
  health-check:
    name: Service Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check GitHub Pages
        id: pages
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 15 --retry 2 --retry-delay 3 \
            "https://gatewayhq.github.io/")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "200" ]; then
            echo "✅ GitHub Pages: $STATUS"
          else
            echo "❌ GitHub Pages: $STATUS"
          fi

      - name: Check Supabase Edge Function Health
        id: edge
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SB_URL" ]; then
            echo "::notice::SUPABASE_URL not set — skipping Edge Function check"
            echo "status=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEALTH_URL="${SB_URL}/functions/v1/gateway-api/api/health"
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 --retry 2 \
            "$HEALTH_URL" 2>/dev/null) || HTTP_CODE="000"
          RESPONSE=$(curl -s --max-time 15 "$HEALTH_URL" 2>&1 || true)
          echo "status=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Edge Function: $HTTP_CODE"
            echo "   Response: $RESPONSE"
          else
            echo "❌ Edge Function: $HTTP_CODE"
          fi

      - name: Check Supabase REST API
        id: supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SB_URL" ]; then
            echo "::notice::SUPABASE_URL not set — skipping Supabase check"
            echo "status=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/") || STATUS="000"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" == "2"* ]] || [ "$STATUS" = "404" ]; then
            echo "✅ Supabase REST: $STATUS (reachable)"
          else
            echo "❌ Supabase REST: $STATUS"
          fi

      - name: Write health snapshot to Supabase
        if: env.SB_URL != ''
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAGES_STATUS: ${{ steps.pages.outputs.status }}
          EDGE_STATUS:  ${{ steps.edge.outputs.status }}
          SB_STATUS:    ${{ steps.supabase.outputs.status }}
        run: |
          PAYLOAD=$(cat <<JSON
          {
            "checked_at":  "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "pages_ok":    $([ "$PAGES_STATUS" = "200" ] && echo true || echo false),
            "edge_ok":     $([ "$EDGE_STATUS" = "200" ] || [ "$EDGE_STATUS" = "skip" ] && echo true || echo false),
            "supabase_ok": true,
            "pages_status": "$PAGES_STATUS",
            "edge_status":  "$EDGE_STATUS",
            "run_id":      "${{ github.run_id }}"
          }
          JSON
          )
          curl -sf -X POST "$SB_URL/rest/v1/system_health" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD" \
          || echo "::warning::Could not write to system_health table (may not exist yet)"

      - name: Alert on degradation
        if: |
          steps.pages.outputs.status != '200' ||
          (steps.edge.outputs.status != '200' && steps.edge.outputs.status != 'skip')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGES="${{ steps.pages.outputs.status }}"
          EDGE="${{ steps.edge.outputs.status }}"
          BODY="## 🚨 Service Degradation Detected

          | Service | Status |
          |---|---|
          | GitHub Pages | $PAGES |
          | Supabase Edge Function | $EDGE |

          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Time:** $(date -u)

          _Auto-generated by Health Monitor workflow. Close this issue when resolved._"

          # Check if an open health issue already exists before creating a new one
          OPEN_ISSUES=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=health-alert&per_page=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))")

          if [ "$OPEN_ISSUES" = "0" ]; then
            curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "{\"title\":\"🚨 Service degradation — $(date -u +%Y-%m-%d)\",\"body\":$(echo "$BODY" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))'),\"labels\":[\"health-alert\"]}"
            echo "::error::Health alert issue created — services are degraded."
          else
            echo "::warning::Services degraded but health-alert issue already open."
          fi
